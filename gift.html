<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>領取職場大禮包｜青銀共創</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang TC',sans-serif;background:#f5f7fa;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:white;border-radius:16px;max-width:520px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.10);overflow:hidden}
.header{background:#1B3A6B;padding:32px 28px 24px;text-align:center}
.brand{color:#F5A623;font-size:13px;font-weight:600;letter-spacing:2px;margin-bottom:8px}
h1{color:white;font-size:22px;font-weight:700;line-height:1.4}
.badge{display:inline-block;background:#F5A623;color:#1B3A6B;font-weight:700;font-size:13px;border-radius:20px;padding:4px 14px;margin-top:12px}
.body{padding:28px}
.gift-box{background:#EEF2F8;border-radius:12px;padding:16px 18px;margin-bottom:22px}
.gift-box h3{color:#1B3A6B;font-size:15px;font-weight:700;margin-bottom:10px}
.item{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:14px;color:#333}
.icon{flex-shrink:0;font-size:16px}
.free-tag{display:inline-block;background:#38A169;color:white;font-size:11px;font-weight:700;border-radius:4px;padding:2px 8px;margin-left:6px;vertical-align:middle}
form{display:flex;flex-direction:column;gap:14px}
.form-title{font-size:14px;font-weight:600;color:#444;margin-bottom:4px}
label{font-size:13px;font-weight:600;color:#444;margin-bottom:4px;display:block}
input{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;font-family:inherit;outline:none}
input:focus{border-color:#1B3A6B}
.btn{background:#F5A623;color:#1B3A6B;font-weight:800;font-size:17px;border:none;border-radius:10px;padding:15px;cursor:pointer;width:100%}
.note{font-size:12px;color:#999;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="brand">青 銀 共 創</div>
    <h1>📥 免費領取<br>職場生存大禮包</h1>
    <div class="badge">限時免費 · 立即取得</div>
  </div>
  <div class="body">
    <div class="gift-box">
      <h3>大禮包內容（試閱版）：</h3>
      <div class="item"><span class="icon">📋</span><span>向上管理話術表 <span class="free-tag">免費</span></span></div>
      <div class="item"><span class="icon">📈</span><span>高管升遷評分真實標準</span></div>
      <div class="item"><span class="icon">🎯</span><span>職場第一年必知潛規則</span></div>
    </div>
    <p class="form-title">填寫後立即取得下載連結 👇</p>
    <form action="https://formsubmit.co/ainetrender@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="📥 有人領取職場大禮包！青銀共創">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://github.com/brunella328/qingyin-co-create/releases/download/v1.0/workplace-guide-preview.pdf">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="類型" value="領取大禮包">

      <div>
        <label>姓名 *</label>
        <input type="text" name="姓名" placeholder="你的名字" required>
      </div>
      <div>
        <label>Email *</label>
        <input type="email" name="Email" placeholder="your@email.com" required>
      </div>
      <button type="submit" class="btn">立即領取 →</button>
      <div class="note">填寫後自動跳轉至 PDF 下載 · 不發垃圾郵件</div>
    </form>
  </div>
</div>
</body>
</html>
