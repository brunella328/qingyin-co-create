<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青銀共創｜Early Bird 搶先登記</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      overflow: hidden;
    }
    .header {
      background: #1B3A6B;
      padding: 32px 28px 24px;
      text-align: center;
    }
    .header .brand { color: #F5A623; font-size: 13px; font-weight: 600; letter-spacing: 2px; margin-bottom: 8px; }
    .header h1 { color: white; font-size: 22px; font-weight: 700; line-height: 1.4; }
    .badge {
      display: inline-block;
      background: #F5A623;
      color: #1B3A6B;
      font-weight: 700;
      font-size: 13px;
      border-radius: 20px;
      padding: 4px 14px;
      margin-top: 12px;
    }
    .body { padding: 28px; }
    .price-box {
      background: #EEF2F8;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .price-now { font-size: 28px; font-weight: 800; color: #1B3A6B; }
    .price-orig { font-size: 13px; color: #999; text-decoration: line-through; }
    .price-desc { font-size: 12px; color: #666; }
    .features { margin-bottom: 24px; }
    .feature {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
      color: #333;
    }
    .feature:last-child { border-bottom: none; }
    .check { color: #38A169; font-weight: 700; flex-shrink: 0; }
    form { display: flex; flex-direction: column; gap: 14px; }
    label { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 4px; display: block; }
    input, select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus, select:focus { border-color: #1B3A6B; }
    .submit-btn {
      background: #F5A623;
      color: #1B3A6B;
      font-weight: 800;
      font-size: 17px;
      border: none;
      border-radius: 10px;
      padding: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 4px;
    }
    .submit-btn:hover { opacity: 0.9; }
    .footer-note { font-size: 12px; color: #999; text-align: center; margin-top: 10px; }

    /* Success state */
    .success-box {
      display: none;
      text-align: center;
      padding: 20px 0;
    }
    .success-box .icon { font-size: 52px; margin-bottom: 12px; }
    .success-box h2 { color: #1B3A6B; font-size: 20px; margin-bottom: 8px; }
    .success-box p { color: #666; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="brand">青 銀 共 創</div>
    <h1>新鮮人職場生存大禮包<br>搶先登記</h1>
    <div class="badge">Early Bird 特惠</div>
  </div>
  <div class="body">
    <div class="price-box">
      <div>
        <div class="price-now">NT$149</div>
        <div class="price-orig">原價 NT$399</div>
      </div>
      <div>
        <div class="price-desc">登記後享 Early Bird 特惠<br>正式開賣前 48 小時 Email 通知</div>
      </div>
    </div>
    <div class="features">
      <div class="feature"><span class="check">✓</span>非公開升遷指標（高管評分真實標準）</div>
      <div class="feature"><span class="check">✓</span>向上管理話術表（15 個情境標準話術）</div>
      <div class="feature"><span class="check">✓</span>高管視角面試指南（破解面試邏輯）</div>
    </div>

    <!-- Form -->
    <form id="waitlistForm">
      <div>
        <label for="name">姓名 *</label>
        <input type="text" id="name" name="name" placeholder="你的名字" required>
      </div>
      <div>
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
      </div>
      <div>
        <label for="status">目前職場狀態 *</label>
        <select id="status" name="status" required>
          <option value="">請選擇</option>
          <option value="求職中">求職中</option>
          <option value="入職0-1年">入職 0-1 年</option>
          <option value="入職1-3年">入職 1-3 年</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div>
        <label for="pain">最大的職場困擾？（選填）</label>
        <select id="pain" name="pain">
          <option value="">請選擇</option>
          <option value="不知道怎麼和主管溝通">不知道怎麼和主管溝通</option>
          <option value="擔心試用期表現不達標">擔心試用期表現不達標</option>
          <option value="不懂職場升遷邏輯">不懂職場升遷邏輯</option>
          <option value="跨部門協作卡關">跨部門協作卡關</option>
        </select>
      </div>
      <button type="submit" class="submit-btn">立即搶先登記 →</button>
      <div class="footer-note">填寫即代表同意接收開賣通知 Email，不會發送垃圾郵件</div>
    </form>

    <!-- Success -->
    <div class="success-box" id="successBox">
      <div class="icon">🎉</div>
      <h2>登記成功！</h2>
      <p>感謝你的支持！<br>你已獲得 Early Bird 資格（NT$149）。<br><br>我們將在正式開賣前 48 小時<br>以 Email 通知你。<br><br>— 青銀共創團隊</p>
    </div>
  </div>
</div>

<script>
  document.getElementById('waitlistForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = this.querySelector('.submit-btn');
    btn.textContent = '送出中...';
    btn.disabled = true;

    const data = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      status: document.getElementById('status').value,
      pain: document.getElementById('pain').value,
      _subject: '青銀共創 Early Bird 登記',
      _template: 'table'
    };

    try {
      const res = await fetch('https://task-manufacture-extreme-nasa.trycloudflare.com/waitlist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(data)
      });

      if (res.ok) {
        document.getElementById('waitlistForm').style.display = 'none';
        document.getElementById('successBox').style.display = 'block';
      } else {
        btn.textContent = '送出失敗，請重試';
        btn.disabled = false;
      }
    } catch(err) {
      btn.textContent = '網路錯誤，請重試';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
